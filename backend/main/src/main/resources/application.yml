spring:
  application:
    name: main

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MAIN_DB_HOST}:${MAIN_DB_PORT}/${MAIN_DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MAIN_DB_USERNAME}
    password: ${MAIN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MAIN_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${MAIN_HIKARI_MIN_IDLE:5}
      connection-timeout: ${MAIN_HIKARI_CONNECTION_TIMEOUT:3000}
      max-lifetime: ${MAIN_HIKARI_MAX_LIFETIME:1800000}
      idle-timeout: ${MAIN_HIKARI_IDLE_TIMEOUT:600000}
      leak-detection-threshold: ${MAIN_HIKARI_LEAK_DETECTION:5000}

  jpa:
    hibernate:
      ddl-auto: ${MAIN_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: ${MAIN_HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${MAIN_HIBERNATE_USE_SQL_COMMENTS:true}

  data:
    redis:
      host: ${MAIN_REDIS_HOST:localhost}
      port: ${MAIN_REDIS_PORT:6379}
      password: ${MAIN_REDIS_PASSWORD}
      ssl:
        enabled: ${MAIN_REDIS_SSL_ENABLED:false}

  lifecycle:
    timeout-per-shutdown-phase: ${MAIN_SHUTDOWN_TIMEOUT:30s}

server:
  port: ${MAIN_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${MAIN_TOMCAT_MAX_THREADS:300}
      min-spare: ${MAIN_TOMCAT_MIN_SPARE_THREADS:50}
    accept-count: ${MAIN_TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${MAIN_TOMCAT_MAX_CONNECTIONS:8192}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:300000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:43200000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${MAIN_TRACING_ENABLED:true}
    baggage:
      enabled: true
      remote-fields: traceId
      correlation:
        fields: traceId

entry:
  reservation:
    ttl-seconds: ${MAIN_ENTRY_RESERVATION_TTL_SECONDS:600}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  sdk:
    connection-timeout-seconds: ${AWS_SDK_CONNECTION_TIMEOUT_SECONDS:5}
    socket-timeout-seconds: ${AWS_SDK_SOCKET_TIMEOUT_SECONDS:5}
    api-call-timeout-seconds: ${AWS_SDK_API_CALL_TIMEOUT_SECONDS:5}
    api-call-attempt-timeout-seconds: ${AWS_SDK_API_CALL_ATTEMPT_TIMEOUT_SECONDS:5}
  s3:
    bucket: ${AWS_S3_BUCKET}
    presign-expire-seconds: ${AWS_S3_PRESIGN_EXPIRE_SECONDS:300}

api:
  url:
    auth: ${AUTH_SERVICE_URI:http://localhost:8081}

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET:onrace-super-secret-key}

order:
  prepare-token:
    ttl-seconds: ${MAIN_ORDER_PREPARE_TOKEN_TTL_SECONDS:300}

toss:
  payment:
    secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
    url: https://api.tosspayments.com/v1/payments/confirm
