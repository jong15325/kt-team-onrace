server:
  port: ${QUEUE_SERVER_PORT:8082}
  shutdown: graceful
  tomcat:
    threads:
      max: ${QUEUE_TOMCAT_MAX_THREADS:150}
      min-spare: ${QUEUE_TOMCAT_MIN_SPARE_THREADS:30}
    accept-count: ${QUEUE_TOMCAT_ACCEPT_COUNT:200}
    max-connections: ${QUEUE_TOMCAT_MAX_CONNECTIONS:2000}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${QUEUE_SHUTDOWN_TIMEOUT:30s}

  application:
    name: queue

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${QUEUE_REDIS_HOST:localhost}
      port: ${QUEUE_REDIS_PORT:6379}
      password: ${QUEUE_REDIS_PASSWORD}
      ssl:
        enabled: ${QUEUE_REDIS_SSL_ENABLED:false}

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET}

queue:
  batch-size: ${QUEUE_BATCH_SIZE:100}
  interval-ms: ${QUEUE_INTERVAL_MS:3000}
  pass-ttl-seconds: ${QUEUE_PASS_TTL_SECONDS:600}
  token-secret: ${QUEUE_TOKEN_SECRET}
  poll-base-ms: ${QUEUE_POLL_BASE_MS:3000}
  poll-jitter-ms: ${QUEUE_POLL_JITTER_MS:2000}
  # 시작/종료 시 잔존 대기열(Redis) 정리. 데모/개발은 true.
  # ⚠️ 다중 인스턴스·롤링 재배포 운영에선 살아있는 대기열을 날리므로 false 권장.
  clear-on-startup: ${QUEUE_CLEAR_ON_STARTUP:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
