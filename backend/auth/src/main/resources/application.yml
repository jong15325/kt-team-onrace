spring:
  application:
    name: auth

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dummy@gmail.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
      password: ${AUTH_REDIS_PASSWORD}

  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${AUTH_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${AUTH_HIKARI_MIN_IDLE:5}
      connection-timeout: ${AUTH_HIKARI_CONNECTION_TIMEOUT:3000}
      max-lifetime: ${AUTH_HIKARI_MAX_LIFETIME:1800000}
      idle-timeout: ${AUTH_HIKARI_IDLE_TIMEOUT:600000}

  jpa:
    hibernate:
      ddl-auto: ${AUTH_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: ${AUTH_HIBERNATE_FORMAT_SQL:true}
        use_sql_comments: ${AUTH_HIBERNATE_USE_SQL_COMMENTS:true}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - mobile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  lifecycle:
    timeout-per-shutdown-phase: ${AUTH_SHUTDOWN_TIMEOUT:30s}

server:
  port: ${AUTH_SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${AUTH_TOMCAT_MAX_THREADS:200}
      min-spare: ${AUTH_TOMCAT_MIN_SPARE_THREADS:30}
    accept-count: ${AUTH_TOMCAT_ACCEPT_COUNT:100}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:300000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:43200000}

api:
  url:
    main: ${MAIN_SERVICE_URI}

app:
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3000/password/reset}
solapi:
  api-key: ${SOLAPI_API_KEY:dummy_key}
  api-secret: ${SOLAPI_API_SECRET:dummy_secret}
  sender: ${SOLAPI_SENDER:01012345678}

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:dummy}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}