server:
  port: ${GATEWAY_SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: ${GATEWAY_SHUTDOWN_TIMEOUT:30s}
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}
      password: ${GATEWAY_REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                  - X-Request-Id
                  - X-Queue-Enabled
                  - X-Trace-Id
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Forwarded-Prefix, /auth
#                - name: RequestRateLimiter
#                  args:
#                    redis-rate-limiter.replenishRate: 50
#                    redis-rate-limiter.burstCapacity: 100
#                    redis-rate-limiter.requestedTokens: 1
#                    key-resolver: "#{@userOrIpKeyResolver}"
            - id: queue-route
              uri: ${QUEUE_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/queue/**
              filters:
#                - name: BotDetectionFilter
#                  args:
#                    challengeUri: ${CHALLENGE_URI:http://localhost:3000/challenge}
#                - name: RequestRateLimiter
#                  args:
#                    redis-rate-limiter.replenishRate: 50
#                    redis-rate-limiter.burstCapacity: 100
#                    redis-rate-limiter.requestedTokens: 1
#                    key-resolver: "#{@userOrIpKeyResolver}"
            - id: entry-apply-lottery-route
              uri: ${MAIN_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/main/events/*/entries/apply/lottery
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Forwarded-Prefix, /main
#                - name: RequestRateLimiter
#                  args:
#                    redis-rate-limiter.replenishRate: 10
#                    redis-rate-limiter.burstCapacity: 20
#                    redis-rate-limiter.requestedTokens: 1
#                    key-resolver: "#{@userOrIpKeyResolver}"
            - id: entry-apply-first-come-route
              uri: ${MAIN_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/main/events/*/entries/apply/first-come
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Forwarded-Prefix, /main
#                - name: RequestRateLimiter
#                  args:
#                    redis-rate-limiter.replenishRate: 10
#                    redis-rate-limiter.burstCapacity: 20
#                    redis-rate-limiter.requestedTokens: 1
#                    key-resolver: "#{@userOrIpKeyResolver}"
#                - name: BotDetectionFilter
#                  args:
#                    challengeUri: ${CHALLENGE_URI:http://localhost:3000/challenge}
                - name: WaitingRoomFilter
                  args:
                    queueUrl: ${WAITING_ROOM_URI:http://localhost:3000/queue}
            - id: stock-check-route
              uri: ${MAIN_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/main/events/*/entries/stock-check
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Forwarded-Prefix, /main
                - name: QueueStatusHeaderFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"
            - id: public-route
              uri: ${MAIN_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/main/**
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Forwarded-Prefix, /main
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userOrIpKeyResolver}"
          default-filters:
            - AddRequestHeader=X-Gateway-Token, ${GATEWAY_INTERNAL_SECRET:onrace-super-secret-key}
gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET}
  queue-cache:
    service-uri: ${MAIN_SERVICE_URI:http://localhost:8082}
    enabled-events-path: ${QUEUE_CACHE_ENABLED_EVENTS_PATH:/events/queue-enabled}
  queue-token-secret: ${QUEUE_TOKEN_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:300000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:43200000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}